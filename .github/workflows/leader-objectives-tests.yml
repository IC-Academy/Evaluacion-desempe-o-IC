name: Leader objective regression
on:
  push:
    branches:
      - fix/leader-reopened-objectives-validation
  pull_request:
    paths:
      - 'js/**'
      - 'tests/leader-objectives.test.js'
      - '.github/workflows/leader-objectives-tests.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run leader objectives regression tests
        run: node tests/leader-objectives.test.js
